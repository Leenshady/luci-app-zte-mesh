name: Build APK

# Builds the three zte-mesh packages (zte-mesh, luci-app-zte-mesh, and the
# auto-generated luci-i18n-zte-mesh-zh-cn) as OpenWrt .apk files inside a
# GitHub runner. The packages are compiled against the `zte/zx279133` target
# from the cnjn/immortalwrt fork (branch `sr1010-zx279133`), which is the only
# tree that carries that target.
#
# The ZTE target pins KERNEL_PATCHVER to 6.18 and consumes an EXTERNAL kernel
# tree (Linux 6.18.38 from cnjn/linux-mainline-zte-zxslc-sr1010) instead of an
# upstream tarball. The kernel tree is cloned and passed via
# CONFIG_EXTERNAL_KERNEL_TREE so toolchain/kernel-headers can install UAPI
# headers without trying to download a linux-6.18.38 tarball that does not exist.
#
# Trigger: manual (workflow_dispatch), on pushes to main, or on pull requests.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out this feed
        uses: actions/checkout@v4
        with:
          path: zte-mesh

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk unzip file wget python3 \
            rsync subversion git zstd libncurses-dev \
            swig libssl-dev python3-dev lua5.1 liblua5.1-0-dev \
            meson ninja-build

      - name: Check out ImmortalWrt tree
        run: |
          # The zte/zx279133 target only exists on this fork's branch.
          git clone --depth 1 --branch sr1010-zx279133 \
            https://github.com/cnjn/immortalwrt.git openwrt

      - name: Check out external ZX279133 kernel tree
        run: |
          # The ZTE target uses an EXTERNAL kernel tree (Linux 6.18.38): there is
          # no upstream 6.18 tarball to download, so toolchain/kernel-headers has
          # no source/hash. Cloning the prepared tree lets kernel-headers install
          # its UAPI headers from it instead of trying to fetch linux-6.18.38.tar.xz.
          # The layout must be <dir>/linux-mainline-zte-zxslc-sr1010/linux-6.18.38
          # next to <dir>/immortalwrt, and the kernel is a git submodule.
          git clone --depth 1 --branch build --recurse-submodules \
            https://github.com/cnjn/linux-mainline-zte-zxslc-sr1010.git \
            linux-mainline-zte-zxslc-sr1010

      - name: Install feeds
        working-directory: openwrt
        run: |
          # Point the local feed at the checkout and pull the official feeds
          # (luci is required by luci-app-zte-mesh via $(TOPDIR)/feeds/luci/luci.mk).
          echo "src-link zte_mesh $(pwd)/../zte-mesh/openwrt" > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p zte_mesh
          ./scripts/feeds install -a

      - name: Configure target
        working-directory: openwrt
        run: |
          # Select the target and mark the three packages to be built. Point
          # CONFIG_EXTERNAL_KERNEL_TREE at the cloned kernel so kernel-headers
          # (pulled in by toolchain/install) installs UAPI headers from it rather
          # than trying to download a non-existent linux-6.18.38 tarball.
          KERNEL_TREE="$(pwd)/../linux-mainline-zte-zxslc-sr1010/linux-6.18.38"
          cat >> .config <<EOF
          CONFIG_TARGET_zte=y
          CONFIG_TARGET_zte_zx279133=y
          CONFIG_EXTERNAL_KERNEL_TREE="$KERNEL_TREE"
          CONFIG_PACKAGE_zte-mesh=m
          CONFIG_PACKAGE_luci-app-zte-mesh=m
          CONFIG_PACKAGE_luci-i18n-zte-mesh-zh-cn=m
          EOF
          make defconfig

      - name: Install host tools and target toolchain
        working-directory: openwrt
        run: |
          # `tools/install` stages host tools (meson/ninja for the apk packager);
          # `toolchain/install` stages the aarch64_cortex-a53 gcc, which the
          # nonshared zte-mesh package pulls in via the toolchain/libgcc runtime
          # packages. Without it the build dies on a missing libgcc_s.so.
          make -j1 V=s tools/install
          make -j1 V=s toolchain/install

      - name: Build packages
        working-directory: openwrt
        run: |
          # -j1 the first build so a host-tool failure is not drowned in
          # parallel output; once green this can go parallel. The two packages
          # are built in one invocation so their shared host deps (lua) resolve.
          make -j1 V=s \
            package/feeds/zte_mesh/zte-mesh/compile \
            package/feeds/zte_mesh/luci-app-zte-mesh/compile

      - name: Locate artifacts
        id: collect
        run: |
          # zte-mesh is PKG_FLAGS:=nonshared + PKGARCH:=aarch64_cortex-a53, so it
          # lands under the target packages dir; the LuCI packages are arch:all
          # and land under the feed packages dir.
          mkdir -p dist
          find openwrt/bin -name 'zte-mesh*.apk' -exec cp -v {} dist/ \;
          find openwrt/bin -name 'luci-*zte-mesh*.apk' -exec cp -v {} dist/ \;
          ls -la dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: zte-mesh-apk
          path: dist/
          if-no-files-found: error
