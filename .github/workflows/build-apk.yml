name: Build APK

# Builds the three zte-mesh packages (zte-mesh, luci-app-zte-mesh, and the
# auto-generated luci-i18n-zte-mesh-zh-cn) as OpenWrt .apk files inside a
# GitHub runner. The packages are compiled against the `zte/zx279133` target
# from the cnjn/immortalwrt fork (branch `sr1010-zx279133`), which is the only
# tree that carries that target.
#
# The ZTE target pins KERNEL_PATCHVER to 6.18 with LINUX_VERSION 6.18.38, but
# upstream kernel.org has no 6.18 tarball and the fork ships
# `LINUX_KERNEL_HASH-6.18.38 = x`. toolchain/kernel-headers therefore fails in
# `scripts/download.pl` with "Cannot find appropriate hash command".
#
# Fix: build the tarball ourselves from the prepared ZX279133 kernel tree
# (cnjn/linux-mainline-zte-zxslc-sr1010), drop it into dl/ as
# linux-6.18.38.tar.xz and record its real SHA256 in
# target/linux/generic/kernel-6.18. The dl-file rule has no prerequisites, so
# make then skips the download; the integrity check is satisfied by the hash we
# write. Nothing is fetched from kernel.org.
#
# Trigger: manual (workflow_dispatch), on pushes to main, or on pull requests.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out this feed
        uses: actions/checkout@v4
        with:
          path: zte-mesh

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk unzip file wget python3 \
            rsync subversion git zstd libncurses-dev \
            swig libssl-dev python3-dev lua5.1 liblua5.1-0-dev \
            meson ninja-build xz-utils

      - name: Check out ImmortalWrt tree
        run: |
          # The zte/zx279133 target only exists on this fork's branch.
          git clone --depth 1 --branch sr1010-zx279133 \
            https://github.com/cnjn/immortalwrt.git openwrt

      - name: Seed dl/ with the ZX279133 kernel tarball
        run: |
          # 1) Fetch the prepared kernel sources. They live on the
          #    `codex/sr1010-mainline` branch of this repo (the superproject's
          #    `build` branch only pins it as a submodule of the same URL), so a
          #    shallow clone of the branch is enough and gives us the
          #    `linux-6.18.38/` directory the build expects.
          git clone --depth 1 --branch codex/sr1010-mainline \
            https://github.com/cnjn/linux-mainline-zte-zxslc-sr1010.git \
            linux-6.18.38

          test -f linux-6.18.38/Makefile || {
            echo "kernel clone incomplete: no linux-6.18.38/Makefile" >&2
            exit 1
          }
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' linux-6.18.38/Makefile

          # 2) Pack it as dl/linux-6.18.38.tar.xz with a top-level
          #    `linux-6.18.38/` directory, which is what Kernel/Prepare/Default
          #    expects when it untars into KERNEL_BUILD_DIR. .git is excluded to
          #    keep the archive small.
          mkdir -p openwrt/dl
          tar -C . --exclude=.git -cf - linux-6.18.38 \
            | xz -T0 -3 > openwrt/dl/linux-6.18.38.tar.xz

          # 3) Record the real SHA256 so the integrity check passes and the
          #    dl rule (which has no prerequisites) is skipped entirely.
          SHA256=$(sha256sum openwrt/dl/linux-6.18.38.tar.xz | cut -d' ' -f1)
          sed -i "s|^LINUX_KERNEL_HASH-6.18.38 = .*|LINUX_KERNEL_HASH-6.18.38 = $SHA256|" \
            openwrt/target/linux/generic/kernel-6.18

          echo "tarball: $(du -h openwrt/dl/linux-6.18.38.tar.xz | cut -f1), sha256=$SHA256"
          cat openwrt/target/linux/generic/kernel-6.18

          # 4) The sources are no longer needed: the build untars the archive.
          #    Free the space (a kernel checkout is well over 1 GB).
          rm -rf linux-6.18.38

      - name: Install feeds
        working-directory: openwrt
        run: |
          # Point the local feed at the checkout and pull the official feeds
          # (luci is required by luci-app-zte-mesh via $(TOPDIR)/feeds/luci/luci.mk).
          echo "src-link zte_mesh $(pwd)/../zte-mesh/openwrt" > feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p zte_mesh
          ./scripts/feeds install -a

      - name: Configure target
        working-directory: openwrt
        run: |
          # Select the target and mark the three packages to be built. The
          # kernel source is already in dl/ (see the previous step), so nothing
          # here needs to fetch a kernel.
          cat >> .config <<EOF
          CONFIG_TARGET_zte=y
          CONFIG_TARGET_zte_zx279133=y
          CONFIG_PACKAGE_zte-mesh=m
          CONFIG_PACKAGE_luci-app-zte-mesh=m
          CONFIG_PACKAGE_luci-i18n-zte-mesh-zh-cn=m
          EOF
          make defconfig

      - name: Install host tools and target toolchain
        working-directory: openwrt
        run: |
          # `tools/install` stages host tools (meson/ninja for the apk packager);
          # `toolchain/install` stages the aarch64_cortex-a53 gcc, which the
          # nonshared zte-mesh package pulls in via the toolchain/libgcc runtime
          # packages. Without it the build dies on a missing libgcc_s.so.
          # kernel-headers (part of the toolchain chain) now unpacks our seeded
          # dl/linux-6.18.38.tar.xz instead of hitting kernel.org.
          df -h /
          make -j$(nproc) V=s tools/install
          make -j$(nproc) V=s toolchain/install

      - name: Build packages
        working-directory: openwrt
        run: |
          # The two packages are built in one invocation so their shared host
          # deps (lua) resolve. A failing subpackage still prints its own
          # "ERROR: <pkg> failed to build" line, so parallel is safe here.
          make -j$(nproc) V=s \
            package/feeds/zte_mesh/zte-mesh/compile \
            package/feeds/zte_mesh/luci-app-zte-mesh/compile

      - name: Locate artifacts
        id: collect
        run: |
          # zte-mesh is PKG_FLAGS:=nonshared + PKGARCH:=aarch64_cortex-a53, so it
          # lands under the target packages dir; the LuCI packages are arch:all
          # and land under the feed packages dir.
          mkdir -p dist
          find openwrt/bin -name 'zte-mesh*.apk' -exec cp -v {} dist/ \;
          find openwrt/bin -name 'luci-*zte-mesh*.apk' -exec cp -v {} dist/ \;
          ls -la dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: zte-mesh-apk
          path: dist/
          if-no-files-found: error
