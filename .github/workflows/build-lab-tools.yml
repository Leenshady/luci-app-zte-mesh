name: Build lab tools

# The sandbox launcher (`ns-run`) is host-architecture: the package ships the
# AArch64 build for the router, but the lab VM is x86_64, so it needs its own.
# This job cross-checks that ns-run still compiles for a foreign architecture
# (it is plain POSIX + rtnetlink) and publishes the binary to this branch so the
# VM can fetch it over plain https:
#
#   wget -O /usr/libexec/zte-mesh/ns-run \
#     https://raw.githubusercontent.com/<owner>/<repo>/lab-tools/prebuilt/ns-run-x86_64
#
# Nothing here is part of a router image; it only exists for the x86_64 lab.

on:
  push:
    branches: [lab-tools]
    paths:
      - ns-run.c
      - controller-net.c
      - .github/workflows/build-lab-tools.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab-tools
  cancel-in-progress: true

jobs:
  ns-run-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install a static libc toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools file

      - name: Build ns-run (x86_64, static musl)
        run: |
          # The same sources and flags as the Makefile's ns-run rule; only
          # $(ROUTERCC) changes. Ubuntu's gcc predefines _FORTIFY_SOURCE, which
          # turns an ignored write() return in controller-net.c into -Werror.
          mkdir -p prebuilt
          musl-gcc -O2 -std=c11 -static -Wall -Wextra -Werror \
            -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=0 \
            ns-run.c controller-net.c -o prebuilt/ns-run-x86_64
          file prebuilt/ns-run-x86_64
          ls -l prebuilt/ns-run-x86_64
          sha256sum prebuilt/ns-run-x86_64 > prebuilt/ns-run-x86_64.sha256
          cat prebuilt/ns-run-x86_64.sha256

      - name: Publish the binary to this branch
        run: |
          git config user.name "lab-tools"
          git config user.email "lab-tools@users.noreply.github.com"
          git add -f prebuilt/
          git commit -m "lab: ns-run for x86_64 ($(date -u +%Y-%m-%dT%H:%MZ))" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: ns-run-x86_64
          path: prebuilt/ns-run-x86_64*
          if-no-files-found: error
